[package]
name = "work-report"
version = "0.1.3"
description = "A workspace-based Markdown work journal"
authors = ["WorkReport"]
edition = "2021"
rust-version = "1.90"

[lib]
name = "work_report_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
tauri-plugin-clipboard-manager = "2"
umya-spreadsheet = "3.1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "mysql", "postgres"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
