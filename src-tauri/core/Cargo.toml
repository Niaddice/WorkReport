[package]
name = "workreport-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
sha2 = "0.10"
tempfile = "3"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "system-proxy", "socks"] }
tokio = { version = "1", features = ["process", "io-util", "time", "sync", "macros", "rt-multi-thread", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }
umya-spreadsheet = "3.1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
quick-xml = "0.41"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "sqlite", "mysql", "postgres"] }
uuid = { version = "1", features = ["v4"] }
encoding_rs = "0.8"
calamine = { version = "0.37", default-features = false, features = ["dates"] }
zeroize = "1"
