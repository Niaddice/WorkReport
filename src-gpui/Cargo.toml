[package]
name = "workreport-gpui-prototype"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"
publish = false

[dependencies]
gpui-kit = "=0.10.0"
markdown = "1.0.0"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chinese-lunisolar-calendar = { version = "=0.2.5", default-features = false }
tokio = { version = "1", features = ["rt", "time", "net"] }
dirs = "6"
serde_json = "1"
tempfile = "3"
workreport-core = { path = "../src-tauri/core" }

[dev-dependencies]
gpui-kit = { version = "=0.10.0", features = ["test-support"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 1

[package.metadata.packager]
product-name = "WorkReport"
identifier = "com.workreport.desktop"
publisher = "WorkReport"
icons = [
    "../src-tauri/icons/32x32.png",
    "../src-tauri/icons/128x128.png",
    "../src-tauri/icons/128x128@2x.png",
    "../src-tauri/icons/icon.icns",
    "../src-tauri/icons/icon.ico",
]
